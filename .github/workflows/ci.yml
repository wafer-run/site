name: CI

on:
  push:
    branches: [main]
  pull_request:

# The site builds against sibling checkouts of wafer-run and impresspress
# (path dependencies, see Cargo.toml). Both are pinned to exact commits so
# the site's CI verdict changes only when this file does: bump a pin in the
# same PR that adapts the site to it. Cargo.toml's [patch] table points
# impresspress's git-pinned wafer-run crates at the same wafer-run checkout,
# so IMPRESSPRESS_REF must build against WAFER_RUN_REF. Cargo.lock is
# committed and every cargo step runs `--locked`; Cargo.toml's js-sys
# `[patch.crates-io]` rev and rust-toolchain.toml's channel follow
# IMPRESSPRESS_REF's own, so bump them with it.
env:
  WAFER_RUN_REF: 6fa4b2058751cdaba2f53fe9b79dba88ec430650
  IMPRESSPRESS_REPO: impresspress/impresspress
  IMPRESSPRESS_REF: 75782e2a2c5333372524cd5c3ee1fce878c961f7

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          path: site
      - name: Checkout wafer-run
        uses: actions/checkout@v4
        with:
          repository: wafer-run/wafer-run
          ref: ${{ env.WAFER_RUN_REF }}
          path: wafer-run
      - name: Checkout impresspress
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IMPRESSPRESS_REPO }}
          ref: ${{ env.IMPRESSPRESS_REF }}
          path: impresspress
      # The check deploy-cloudflare.sh runs before it builds, on the layout
      # it was written for: proves it parses this file's pins.
      - name: Sibling checkouts at the pins
        working-directory: site
        run: bash -c 'source scripts/lib/deploy-checks.sh && check_sibling_pins "$PWD"'
      # A bare install reads site/rust-toolchain.toml: the pinned channel,
      # clippy, rustfmt and the wasm32-unknown-unknown target.
      - name: Install Rust toolchain
        working-directory: site
        run: rustup toolchain install
      - name: cargo fmt --check
        working-directory: site
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: site
        run: cargo clippy --locked --all-targets -- -D warnings
      # The Cloudflare Worker build (`target-cloudflare`, wasm32): the lane
      # that catches a `worker` crate split from impresspress-cloudflare's,
      # which the native build never compiles.
      - name: cargo clippy (Cloudflare, wasm32)
        working-directory: site
        run: >-
          cargo clippy --locked --lib --target wasm32-unknown-unknown
          --no-default-features --features target-cloudflare -- -D warnings
      - name: cargo test
        working-directory: site
        run: cargo test --locked

  playwright:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          path: site
      - name: Checkout wafer-run
        uses: actions/checkout@v4
        with:
          repository: wafer-run/wafer-run
          ref: ${{ env.WAFER_RUN_REF }}
          path: wafer-run
      - name: Checkout impresspress
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IMPRESSPRESS_REPO }}
          ref: ${{ env.IMPRESSPRESS_REF }}
          path: impresspress
      - name: Install Rust toolchain
        working-directory: site
        run: rustup toolchain install
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: cargo build --release
        working-directory: site
        run: cargo build --locked --release
      - name: npm ci
        working-directory: site
        run: npm ci
      - name: playwright install
        working-directory: site
        run: npx playwright install --with-deps
      - name: Start wafer-site server
        working-directory: site
        run: |
          mkdir -p data
          IMPRESSPRESS_DB_PATH=./data/ci.sqlite \
          IMPRESSPRESS_STORAGE_ROOT=./data/storage \
          IMPRESSPRESS_LISTEN=0.0.0.0:8090 \
          ./target/release/wafer-site > /tmp/site.log 2>&1 &
          echo $! > /tmp/site.pid
          # Wait for HTTP to come up
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8090/registry/search; then
              echo "site up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "site failed to start; log:"
          cat /tmp/site.log
          exit 1
      - name: playwright test (registry suite)
        working-directory: site
        run: npx playwright test tests/e2e/registry.spec.ts
      - name: Stop wafer-site server
        if: always()
        run: kill $(cat /tmp/site.pid) 2>/dev/null || true
